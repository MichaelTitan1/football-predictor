name: Fovra future-finished provider-record diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run read-only provider-record diagnostic
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m scripts.neon_future_finished_provider_record_diagnostic | tee neon_future_finished_provider_record_diagnostic.log

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fovra-future-finished-provider-record-diagnostic-${{ github.run_id }}
          path: |
            neon_future_finished_provider_record_diagnostic.json
            neon_future_finished_provider_record_diagnostic.log
          if-no-files-found: error
          retention-days: 14
