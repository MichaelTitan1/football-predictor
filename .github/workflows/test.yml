name: Fovra tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q -r requirements.txt
      - run: python -m compileall api src tests
      - name: Run foundation tests
        shell: bash
        run: |
          set +e
          python -m pytest -vv tests/test_data_foundation.py > /tmp/fovra-test.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then tail -n 80 /tmp/fovra-test.log; fi
          exit "$rc"
      - name: Run real Football-Data smoke test
        shell: bash
        run: |
          set +e
          python -m pytest -vv tests/test_real_football_data_smoke.py > /tmp/fovra-network-test.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then tail -n 120 /tmp/fovra-network-test.log; fi
          exit "$rc"
