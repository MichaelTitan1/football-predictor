name: Fovra data update

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Download real historical Football-Data CSVs
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from src.data_pipeline.data_downloader import download_all_leagues

          now = datetime.now(timezone.utc)
          current_season_start = now.year if now.month >= 7 else now.year - 1
          start_year = max(2019, current_season_start - 5)
          result = download_all_leagues(start_year=start_year, end_year=current_season_start)
          downloaded = sum(len(years) for years in result.values())
          print({"start_year": start_year, "end_year": current_season_start, "downloaded_files": downloaded, "result": result})
          if downloaded == 0:
              raise SystemExit("No real Football-Data CSVs were downloaded; cannot train or predict safely.")
          PY
      - name: Build merged historical dataset
        run: python -m src.data_pipeline.prepare_merged_dataset
      - name: Train CatBoost model from real historical data
        env:
          FOVRA_CATBOOST_ITERATIONS: "600"
          FOVRA_CATBOOST_VERBOSE: "100"
        run: python -m src.models.ensemble_model
      - name: Verify runtime model and data exist
        run: |
          test -f models/football_model.cbm
          test -d data/raw
      - name: Ingest canonical football data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.data_pipeline.update_canonical
      - name: Generate persisted predictions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_MODEL_PATH: models/football_model.cbm
          FOOTBALL_CALIBRATION_PATH: models/football_model_confidence.joblib
        run: python -m src.prediction.generate_predictions
