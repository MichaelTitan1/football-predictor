name: Fovra data update

on:
  schedule:
    # Complete free-provider refresh every 6 hours.
    - cron: '10 */6 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: Update task to run
        required: true
        default: all
        type: choice
        options: [all, football-data, clubelo, weather, features, predictions, results, bootstrap-historical]

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Resolve task
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          else
            echo "task=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Football-Data historical/current CSVs
        if: steps.task.outputs.task == 'all' || steps.task.outputs.task == 'football-data'
        run: |
          python -m src.data_pipeline.data_downloader
          python -m src.data_pipeline.prepare_merged_dataset

      - name: Initial Football-Data bootstrap from 2010
        if: steps.task.outputs.task == 'bootstrap-historical'
        run: |
          python -m src.data_pipeline.data_downloader --bootstrap
          python -m src.data_pipeline.prepare_merged_dataset

      - name: Verify Neon PostgreSQL connectivity
        if: steps.task.outputs.task == 'all' || steps.task.outputs.task == 'football-data' || steps.task.outputs.task == 'results' || steps.task.outputs.task == 'clubelo' || steps.task.outputs.task == 'weather' || steps.task.outputs.task == 'predictions'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -c "from src.data_pipeline.neon_store import NeonStore; store=NeonStore(); store.verify_connection(); print('Neon SELECT 1 succeeded')"

      - name: Upsert Football-Data canonical matches and resolve completed results
        if: steps.task.outputs.task == 'all' || steps.task.outputs.task == 'football-data' || steps.task.outputs.task == 'results'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.data_pipeline.update_canonical --source football-data


      - name: Refresh ClubElo team strength
        if: steps.task.outputs.task == 'all' || steps.task.outputs.task == 'clubelo'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -c "from src.data_pipeline.enrichment import refresh_clubelo; print(refresh_clubelo())"

      - name: Refresh MET Norway weather
        if: steps.task.outputs.task == 'all' || steps.task.outputs.task == 'weather'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MET_NORWAY_USER_AGENT: ${{ vars.MET_NORWAY_USER_AGENT }}
        run: python -c "from src.data_pipeline.enrichment import refresh_weather; print(refresh_weather())"

      - name: Refresh features
        if: steps.task.outputs.task == 'all' || steps.task.outputs.task == 'features'
        run: python -m src.data_pipeline.prepare_merged_dataset

      - name: Generate and archive Match Winner 1X2 predictions
        if: steps.task.outputs.task == 'all' || steps.task.outputs.task == 'predictions'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_MODEL_PATH: models/football_model.cbm
          FOOTBALL_CALIBRATION_PATH: models/football_model_confidence.joblib
        run: python -m src.prediction.generate_predictions
