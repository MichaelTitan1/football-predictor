name: Fovra data update

on:
  schedule:
    - cron: '10 08 * * 1,3'
  workflow_dispatch:
    inputs:
      task:
        description: Update task to run
        required: true
        default: all
        type: choice
        options: [all, football-data, clubelo, features, predictions, results, bootstrap-historical, xgabora-bootstrap, xgabora-verify, xgabora-enrich]

concurrency:
  group: fovra-data-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Restore Football-Data cache
        id: football-data-cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/processed/merged_dataset.csv
          key: fovra-football-data-v3-${{ runner.os }}-${{ hashFiles('config/leagues.json') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Resolve task
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          else
            echo "task=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap audited xgabora historical dataset into Neon
        if: steps.task.outputs.task == 'xgabora-bootstrap'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOVRA_NEON_BATCH_SIZE: '500'
        run: python scripts/xgabora_neon_bootstrap.py

      - name: Verify uploaded xgabora Neon dataset
        if: steps.task.outputs.task == 'xgabora-verify'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/audit_xgabora_neon_bootstrap.py

      - name: Source-aware Football-Data 38-league ingestion
        if: steps.task.outputs.task == 'all' || steps.task.outputs.task == 'football-data' || steps.task.outputs.task == 'bootstrap-historical'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOVRA_NEON_BATCH_SIZE: '500'
        run: python -m src.data_pipeline.football_data_ingest

      - name: Verify Neon PostgreSQL connectivity
        if: always() && (steps.task.outputs.task == 'all' || steps.task.outputs.task == 'football-data' || steps.task.outputs.task == 'results' || steps.task.outputs.task == 'clubelo' || steps.task.outputs.task == 'predictions' || steps.task.outputs.task == 'xgabora-bootstrap' || steps.task.outputs.task == 'xgabora-verify' || steps.task.outputs.task == 'xgabora-enrich')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -c "from src.data_pipeline.neon_store import NeonStore; store=NeonStore(); store.verify_connection(); print('Neon SELECT 1 succeeded')"

      - name: Verify all 38 configured leagues reached Neon
        if: always() && (steps.task.outputs.task == 'all' || steps.task.outputs.task == 'football-data' || steps.task.outputs.task == 'bootstrap-historical' || steps.task.outputs.task == 'xgabora-bootstrap' || steps.task.outputs.task == 'xgabora-verify' || steps.task.outputs.task == 'xgabora-enrich')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          from src.data_pipeline.neon_store import NeonStore
          from src.data_pipeline.league_config import load_enabled_leagues

          expected = {x.key for x in load_enabled_leagues()}
          store = NeonStore()
          rows = store.select('leagues', columns='canonical_key')
          actual = {str(row['canonical_key']) for row in rows}
          missing = sorted(expected - actual)
          unexpected = sorted(actual - expected)
          print(f'Neon league coverage: {len(actual & expected)}/{len(expected)}')
          if missing:
              raise SystemExit('Missing configured leagues in Neon: ' + ', '.join(missing))
          if unexpected:
              print('Unexpected league keys present in Neon: ' + ', '.join(unexpected))
          PY

      - name: Refresh ClubElo team strength
        if: steps.task.outputs.task == 'all' || steps.task.outputs.task == 'clubelo' || steps.task.outputs.task == 'xgabora-enrich'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLUBELO_TIMEOUT_SECONDS: '60'
          CLUBELO_LOOKBACK_DAYS: '7'
          CLUBELO_RETRIES: '4'
        run: python -c "from src.data_pipeline.enrichment import refresh_clubelo; print(refresh_clubelo())"

      - name: Build xgabora leakage-safe ML features
        if: steps.task.outputs.task == 'xgabora-enrich'
        run: python scripts/build_xgabora_features.py

      - name: Refresh legacy features
        if: steps.task.outputs.task == 'all' || steps.task.outputs.task == 'features'
        run: python -m src.data_pipeline.prepare_merged_dataset

      - name: Generate and archive Match Winner 1X2 predictions
        if: steps.task.outputs.task == 'predictions' || steps.task.outputs.task == 'xgabora-enrich'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_MODEL_PATH: models/football_model.cbm
          FOOTBALL_CALIBRATION_PATH: models/football_model_confidence.joblib
          FOVRA_XGABORA_FEATURE_PATH: data/processed/xgabora_merged_dataset.csv
        run: python -m src.prediction.generate_predictions
