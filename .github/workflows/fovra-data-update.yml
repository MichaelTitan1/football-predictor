name: Fovra data update

on:
  schedule:
    # Daily historical refresh and fixture pull.
    - cron: '10 3 * * *'
    # Results + standings every two hours.
    - cron: '20 */2 * * *'
    # Weather for next-24h fixtures every four hours.
    - cron: '35 */4 * * *'
    # Daily ClubElo refresh.
    - cron: '45 4 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: Update task to run
        required: true
        default: all
        type: choice
        options: [all, fixtures, results, weather, clubelo, historical]

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Resolve scheduled task
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "10 3 * * *" ]; then
            echo "task=fixtures" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "20 */2 * * *" ]; then
            echo "task=results" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "35 */4 * * *" ]; then
            echo "task=weather" >> "$GITHUB_OUTPUT"
          else
            echo "task=clubelo" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh historical Football-Data training CSVs
        if: steps.task.outputs.task == 'all' || steps.task.outputs.task == 'historical' || steps.task.outputs.task == 'fixtures'
        run: python -m src.data_pipeline.data_downloader

      - name: Build merged historical dataset
        if: steps.task.outputs.task == 'all' || steps.task.outputs.task == 'historical' || steps.task.outputs.task == 'fixtures'
        run: python -m src.data_pipeline.prepare_merged_dataset

      - name: Train CatBoost model from real historical data
        if: steps.task.outputs.task == 'all' || steps.task.outputs.task == 'historical' || steps.task.outputs.task == 'fixtures'
        env:
          FOVRA_CATBOOST_ITERATIONS: "600"
          FOVRA_CATBOOST_VERBOSE: "100"
        run: python -m src.models.ensemble_model

      - name: Fetch API-Football fixtures
        if: steps.task.outputs.task == 'all' || steps.task.outputs.task == 'fixtures'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m src.data_pipeline.update_canonical --source api-football --mode fixtures

      - name: Fetch API-Football results and standings
        if: steps.task.outputs.task == 'all' || steps.task.outputs.task == 'results'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m src.data_pipeline.update_canonical --source api-football --mode results

      - name: Refresh ClubElo
        if: steps.task.outputs.task == 'all' || steps.task.outputs.task == 'clubelo'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          from src.data_pipeline.enrichment import refresh_clubelo
          print(refresh_clubelo())
          PY

      - name: Refresh MET Norway weather
        if: steps.task.outputs.task == 'all' || steps.task.outputs.task == 'weather'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MET_NORWAY_USER_AGENT: ${{ vars.MET_NORWAY_USER_AGENT }}
        run: |
          python - <<'PY'
          from src.data_pipeline.enrichment import refresh_weather
          print(refresh_weather())
          PY

      - name: Generate persisted CatBoost predictions after successful data update
        if: steps.task.outputs.task != 'weather' && steps.task.outputs.task != 'clubelo'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_MODEL_PATH: models/football_model.cbm
          FOOTBALL_CALIBRATION_PATH: models/football_model_confidence.joblib
        run: python -m src.prediction.generate_predictions
